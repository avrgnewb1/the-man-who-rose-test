<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="manga.css"><title>Settings (manga test)</title></head><body><main class="stage"><div class="bg"></div>
<div class="screen"><div class="screen__body" style="display:flex;flex-direction:column;gap:18px">
<div class="screen__head"><h1 class="screen__title">Settings</h1><a class="btn" href="#">Back</a></div>
<div class="form panel">
<div class="row"><label for="ts">Text speed</label><input id="ts" type="range" min="0" max="10" value="6"></div>
<div class="row"><label for="as">Auto speed</label><input id="as" type="range" min="0" max="10" value="4"></div>
<div class="row"><label for="mv">Music volume</label><input id="mv" type="range" min="0" max="100" value="70"></div>
<div class="row"><label for="sv">Sound volume</label><input id="sv" type="range" min="0" max="100" value="80"></div>
<div class="row"><label for="av">Ambience volume</label><input id="av" type="range" min="0" max="100" value="60"></div>
<div class="row"><span class="lbl" id="rm">Reduce motion</span><div class="seg" role="group" aria-labelledby="rm"><button class="btn toggle" aria-pressed="false">On</button><button class="btn toggle" aria-pressed="true">Off</button></div></div>
<div class="row"><span class="lbl" id="tz">Text size</span><div class="seg" role="group" aria-labelledby="tz"><button class="btn" aria-pressed="false">Normal</button><button class="btn" aria-pressed="true">Large</button><button class="btn" aria-pressed="false">Largest</button></div></div>
<p class="sample">I see it, Bear. Come sit with me.</p>
</div></div></div></main></body></html>
